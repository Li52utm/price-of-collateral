name: Data refresh

# 14:00 UTC on weekdays. Measured publication times (docs/DATA_SOURCES.md): SOFR, TGCR, BGCR and EFFR
# for day d are published at 08:00 New York time on d+1 (12:00 UTC in summer, 13:00 UTC in winter);
# EUR STR at 08:00 Frankfurt time on d+1 (06:00-07:00 UTC). 14:00 UTC is after both all year, with an
# hour of margin for late publications, so each run has the previous business day's SOFR and EUR STR.
on:
  schedule:
    - cron: "0 14 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Download, check, validate, write snapshots, recompute results, score the forecast, update README
        env:
          WEBSTAT_API_KEY: ${{ secrets.WEBSTAT_API_KEY }}   # header-only auth; never echoed
        run: python scripts/refresh_snapshots.py
      - name: The frozen Year-End 2026 forecast must be untouched
        run: git diff --exit-code -- results/forecasts/yearend_2026.json
      - name: Tests (offline)
        run: python -m pytest -q
      - name: Commit and push only if tests passed and files changed
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard results docs README.md)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          AS_OF=$(python -c "import json; print(json.load(open('results/snapshots/manifest.json'))['as_of'])")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A results docs/DATA_VALIDATION.md README.md
          git reset -q -- results/forecasts/yearend_2026.json   # never committed by the bot
          git commit -m "Data refresh: as of ${AS_OF}"
          git push
